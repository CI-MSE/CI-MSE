[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "critical-interval-mse"
version = "0.1.0"
description = "Tools for critical interval annotation and critical interval MSE evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Critical Interval MSE Authors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
metrics = [
  "numpy",
  "scipy",
  "h5py",
  "dtw-python",
  "matplotlib",
]
anno = [
  "numpy",
  "opencv-python",
  "zarr",
  "google-genai",
  "lerobot>=0.3.2,<0.4",
]
all = [
  "numpy",
  "scipy",
  "h5py",
  "dtw-python",
  "matplotlib",
  "opencv-python",
  "zarr",
  "google-genai",
  "lerobot>=0.3.2,<0.4",
]
dev = [
  "pytest",
  "build",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["val_metrics*", "vlm_annotator*"]

[tool.setuptools.package-data]
vlm_annotator = ["prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
